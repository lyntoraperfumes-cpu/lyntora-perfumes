{% extends "base.html" %}
{% block title %}Verify Email — {{ store.store_name }}{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card"><span class="eyebrow">CHECK YOUR EMAIL</span><h1>Enter verification code</h1><p>We sent a 6-digit code to <b>{{ email }}</b>.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn full">VERIFY & CONTINUE</button></form>
<a class="text-link" href="{% url  'customer:login' %}">Use another email</a></div></section>
{% endblock %}
